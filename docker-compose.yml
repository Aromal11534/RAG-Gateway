services:
  gateway:
    build: .
    init: true
    restart: unless-stopped
    env_file:
      - path: ${GATEWAY_ENV_FILE:-.env}
        format: raw
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
